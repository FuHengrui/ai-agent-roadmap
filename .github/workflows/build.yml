name: 构建并部署

# 每次 push 自动做四件事：
#   1. 内容质检（结构 / need 覆盖率 / ★ 密钥泄露 / 个人信息）
#   2. 重新构建站点
#   3. 站点自检（死链 / 样式）
#   4. 开启 Pages（如果需要）并部署
#
# 任何一步失败 → 整个 workflow 变红，去 Actions 页面看日志。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ---- 权限 ----
# pages / id-token 是部署 Pages 必须的。
# contents 保持 read —— 这个工作流**不回写仓库**，避免它自己推自己形成死循环。
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，别互相踩
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 1. 内容质检 ----
      # ★ 这一步会抓 API Key 泄露。
      # 让 AI 写代码示例，它真会把讲义里的真 Key 抄进去 —— 这道闸门救命。
      - name: 内容质检
        run: python tools/check_content.py

      # ---- 2. 重新构建 ----
      - name: 构建站点
        run: |
          python tools/build_site.py
          python tools/sync_index.py

      # ---- 3. 站点自检 ----
      - name: 站点自检
        run: python tools/verify_site.py

      # ---- 4. ★ 开启 Pages（如果还没开）----
      # enablement: true 让 GitHub 自己把 Pages 打开，
      # 省掉「去 Settings → Pages 手动点」那一步。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ---- 5. 打包站点 ----
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
