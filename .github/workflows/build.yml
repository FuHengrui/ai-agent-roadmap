name: 构建并部署

# 每次 push 自动做六件事：
#   1. 内容质检（六块结构 / need 覆盖率 / ★ 密钥泄露 / 个人信息 / 目录与正文一致性 / README 数字）
#   2. 重新构建站点（含搜索索引、sitemap、robots）
#   3. 发布前扫描（全仓：违禁词 / 密钥 / 不该提交的文件）
#   4. 站点一致性（site/ 必须和 content/ 重建结果一致）
#   5. 站点自检（死链 / 样式）
#   6. 开启 Pages（如果需要）并部署
#
# 任何一步失败 → 整个 workflow 变红，去 Actions 页面看日志。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ---- 权限 ----
# pages / id-token 是部署 Pages 必须的。
# contents 保持 read —— 这个工作流**不回写仓库**，避免它自己推自己形成死循环。
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，别互相踩
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 把「Pages 开了没」传给 deploy 那个 job
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 1. 内容质检 ----
      # ★ 这一步会抓 API Key 泄露。
      # 让 AI 写代码示例，它真会把讲义里的真 Key 抄进去 —— 这道闸门救命。
      - name: 内容质检
        run: |
          python tools/check_content.py
          python tools/check_consistency.py
          python tools/build_ledger.py --check
          python tools/stats.py --check

      # ---- 2. 重新构建 ----
      - name: 构建站点
        run: |
          python tools/build_site.py
          python tools/build_search.py
          python tools/build_sitemap.py
          python tools/sync_index.py

      # ---- 3. 发布前扫描 ----
      # ★ 扫的是 git 已跟踪的全部文件（不只是正文）：违禁词、密钥、不该提交的文件类型。
      #   课程来源站名 / 品牌词就拦在这一步 —— 写回正文会在推送时红掉。
      - name: 发布前扫描
        run: python tools/check_publish.py

      # ---- 4. 站点一致性 ----
      # site/ 是要提交的（为了"下载下来双击也能看"），所以它必须和 content/ 的重建结果一致。
      # 不一致 = 有人改了 content 没重建，或者只改了 HTML 没改源文件。
      - name: 站点一致性
        run: |
          git add -A site/
          if ! git diff --cached --quiet; then
            echo "::error title=site/ 没重建::仓库里的 site/ 与 content/ 重建结果不一致，请本地跑 python tools/build_site.py && python tools/build_search.py && python tools/sync_index.py 后一起提交。"
            git diff --cached --stat | tail -20
            exit 1
          fi
          echo "site/ 与 content/ 重建结果一致"

      # ---- 5. 站点自检 ----
      - name: 站点自检
        run: python tools/verify_site.py

      # ---- 6. 检查 Pages 开了没 ----
      # ★ 鸡生蛋问题：GitHub 的默认 GITHUB_TOKEN 没权限【创建】Pages 站点，
      #   所以必须手动开一次：
      #     仓库 → Settings → Pages → Source 选「GitHub Actions」
      #
      #   在开启之前，后面那几步会 skip，工作流显示绿色（带一条警告），
      #   不会一直报红。开了之后自动部署。
      - name: 检查 Pages 是否已开启
        id: pages_check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已开启，继续部署"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages 还没开::去 仓库 → Settings → Pages，Source 选「GitHub Actions」。开完再 push 一次即可。"
          fi

      # ---- 7. 打包站点（Pages 开了才做）----
      - name: 配置 Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Pages 没开就不跑，免得报红
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
